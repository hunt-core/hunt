services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    image: "hunt_framework/app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Published on loopback only: this is the auto-reloading dev server.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      # Optional: copy .env.example to .env to configure the container.
      - path: .env
        required: false
    volumes:
      - ".:/app"
      - "/app/.venv"
    networks:
      - lodge

networks:
  lodge:
    driver: bridge
